[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoflow"
version = "0.1.0"
description = "Filesystem-first, incremental photo ingestion with portable JSON history"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
photoflow = "photoflow.cli:main"

[tool.setuptools.packages.find]
include = ["photoflow*"]
