[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "photoflow-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "wsproto>=1.3.2,<2", "pillow>=10,<13", "python-multipart>=0.0.18", "watchdog>=6,<7", "pillow-heif>=1,<2", "httpx>=0.28,<1"]
[project.scripts]
photoflow-web = "photoflow_web.app:main"
photoflow-auth = "photoflow_web.broker:main"
photoflow-web-migrate = "photoflow_web.migrate:main"
[tool.setuptools.packages.find]
include = ["photoflow_web*"]
[tool.setuptools.package-data]
photoflow_web = ["static/**/*", "static/*", "google_jobs.json"]
