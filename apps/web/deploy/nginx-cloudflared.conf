# Included in nginx's http context. Only cloudflared/local processes can reach
# this origin; HTTPS and the client IP are established at Cloudflare's edge.
limit_req_zone $binary_remote_addr zone=photoflow_public_login:10m rate=5r/m;

server {
    listen 127.0.0.1:8091;
    server_name photos.lbsa71.net;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 9m;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_set_header Host photos.lbsa71.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Cache-Control;

    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/v1/auth/login {
        limit_req zone=photoflow_public_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }
    location = /api/v1/google/worker {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host photos.lbsa71.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
    }
    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
